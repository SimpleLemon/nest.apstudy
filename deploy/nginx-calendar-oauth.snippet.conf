# Include inside the HTTPS server for nest.apstudy.org, before catch-all rules.
# Authorization codes and state must never appear in request-line logs.
# Verify the upstream against the deployed Nest service before installation.
location ~ ^/oauth/calendar/(google|microsoft)/callback$ {
    access_log off;
    error_log /var/log/nginx/nest-calendar-oauth-error.log crit;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8000;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
}
